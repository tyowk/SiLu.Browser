<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Offline</title>
		<style>
			:root {
				--bg: #0f0f11;
				--card: #1b1c20;
				--line: #ffffff1f;
				--text: #f2f2f2;
				--sub: #a0a4ac;
				--accent: #8ab4f8;
				--warn: #f2c14e;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
			}
			body {
				min-height: 100vh;
				min-height: 100svh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: radial-gradient(120% 80% at 50% 0%, #17202e 0%, var(--bg) 60%);
				color: var(--text);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
				padding: 28px 22px;
				-webkit-tap-highlight-color: transparent;
			}
			main {
				width: 100%;
				max-width: 420px;
				text-align: center;
				animation: in 0.5s cubic-bezier(0.05, 0.7, 0.1, 1) both;
			}
			@keyframes in {
				from {
					opacity: 0;
					transform: translateY(14px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			.badge {
				width: 96px;
				height: 96px;
				margin: 0 auto 22px;
				border-radius: 32px;
				display: grid;
				place-items: center;
				background: var(--card);
				border: 1px solid var(--line);
			}
			.badge svg {
				width: 46px;
				height: 46px;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 26px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			p {
				margin: 0;
				color: var(--sub);
				font-size: 15px;
				line-height: 1.5;
			}
			.host {
				display: inline-block;
				max-width: 100%;
				margin-top: 14px;
				padding: 7px 14px;
				border-radius: 999px;
				background: var(--card);
				border: 1px solid var(--line);
				color: var(--text);
				font-size: 13px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				vertical-align: top;
			}
			.tips {
				margin: 24px 0 0;
				padding: 6px 18px;
				border-radius: 22px;
				background: var(--card);
				border: 1px solid var(--line);
				text-align: left;
				list-style: none;
			}
			.tips li {
				display: flex;
				gap: 12px;
				align-items: center;
				padding: 12px 0;
				font-size: 14px;
				color: var(--text);
			}
			.tips li + li {
				border-top: 1px solid var(--line);
			}
			.tips i {
				flex: none;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--accent);
			}
			.actions {
				margin-top: 26px;
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				justify-content: center;
			}
			button {
				border: 0;
				border-radius: 999px;
				padding: 14px 26px;
				font-size: 15px;
				font-weight: 600;
				font-family: inherit;
				transition:
					transform 0.15s cubic-bezier(0.05, 0.7, 0.1, 1),
					opacity 0.15s;
			}
			button:active {
				transform: scale(0.95);
			}
			.primary {
				background: var(--accent);
				color: #0b1a33;
			}
			.ghost {
				background: transparent;
				color: var(--accent);
				border: 1px solid #8ab4f866;
			}
			details {
				margin-top: 22px;
				text-align: left;
				color: var(--sub);
				font-size: 12px;
			}
			summary {
				cursor: pointer;
				text-align: center;
				list-style: none;
				padding: 6px;
			}
			code {
				display: block;
				margin-top: 8px;
				padding: 12px 14px;
				border-radius: 14px;
				background: var(--card);
				border: 1px solid var(--line);
				color: var(--text);
				font-size: 12px;
				word-break: break-all;
			}
			.badge {
				border-color: #8ab4f855;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="badge">
				<svg
					viewBox="0 0 24 24"
					fill="none"
					stroke="#8ab4f8"
					stroke-width="1.8"
					stroke-linecap="round"
					stroke-linejoin="round">
					<path
						d="M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8a15 15 0 0 0-9.4-4.7M5 12.5a10 10 0 0 1 3.1-2M19 12.5a10 10 0 0 0-5-2.7M8.5 16.1a5 5 0 0 1 3.5-1.1 5 5 0 0 1 3.5 1.1" />
					<circle cx="12" cy="19.3" r=".6" fill="#8ab4f8" />
					<path d="M3 3l18 18" />
				</svg>
			</div>
			<h1>You're offline</h1>
			<p>SiLu can't reach the internet right now.</p>
			<span class="host">{{HOST}}</span>
			<ul class="tips">
				<li><i></i>Turn off airplane mode</li>
				<li><i></i>Check Wi-Fi or mobile data</li>
				<li><i></i>Move closer to your router or signal</li>
			</ul>
			<div class="actions">
				<button class="primary" id="retry">Try again</button>
				<button class="ghost" id="home">Go home</button>
			</div>
			<p style="margin-top: 18px; font-size: 12px">This page reloads by itself when you're back online.</p>
		</main>
		<script>
			var T={{TARGET}},H={{HOME}};
			document.getElementById('retry').onclick=function(){location.replace(T)};
			document.getElementById('home').onclick=function(){location.replace(H)};
			window.addEventListener('online',function(){location.replace(T)});
		</script>
	</body>
</html>
