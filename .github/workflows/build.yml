name: Build APK
on:
    push:
        branches: [main, master]
        tags: ["v*"]
    workflow_dispatch:
permissions:
    contents: write
jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17
            - uses: gradle/actions/setup-gradle@v5
              with:
                  gradle-version: 8.7
            - name: Decode keystore
              run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            - name: Build signed release APK
              env:
                  KEYSTORE_PATH: ${{ runner.temp }}/release.jks
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: gradle assembleRelease --no-daemon
            - name: Rename APK
              run: cp app/build/outputs/apk/release/app-release.apk SiLuBrowser.apk
            - uses: actions/upload-artifact@v5
              with:
                  name: SiLuBrowser-apk
                  path: SiLuBrowser.apk
            - name: Publish release (tags only)
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    # release sudah ada (mis. dibuat lewat UI GitHub) -> cukup tempel/timpa APK
                    gh release upload "$GITHUB_REF_NAME" SiLuBrowser.apk --clobber
                  else
                    gh release create "$GITHUB_REF_NAME" SiLuBrowser.apk --title "SiLu Browser $GITHUB_REF_NAME" --generate-notes
                  fi
